task:
  task_id: click-3458-parameter-source-during-conversion
  repository_url: https://github.com/pallets/click.git
  pre_fix_commit: 4b24a6c8f6658ef89fd6db4dcaf8ee88eef75dfa
  issue_title: "`get_parameter_source()` returns `None` in 8.4.0"
  issue_body: >-
    During Click parameter type conversion, get_parameter_source() can return None even though
    Click has already determined whether the value came from a default or the command line. A
    custom ParamType should be able to inspect that source consistently during conversion. Normal
    option parsing and parameter-source reporting must continue to behave correctly.
  approved_commands:
    reproduce-click-3458:
      argv:
        - python
        - -B
        - -c
        - |-
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "src"))

          import click
          from click.testing import CliRunner

          click_file = Path(click.__file__).resolve()
          workspace_package = (Path.cwd() / "src/click").resolve()
          print("PYTHON_EXECUTABLE=" + sys.executable)
          print("CLICK_FILE=" + click.__file__)
          if not click_file.is_relative_to(workspace_package):
              print("REPOFIX_CLICK_3458_PROVENANCE_ERROR")
              raise SystemExit(2)


          class Source(click.ParamType):
              name = "source"

              def convert(self, value, param, ctx):
                  return ctx.get_parameter_source(param.name)


          @click.command()
          @click.option("--default", type=Source(), default="fallback")
          @click.option("--nodefault", type=Source())
          def cli(default, nodefault):
              def source_name(source):
                  return "NONE" if source is None else source.name

              click.echo(
                  f"default={source_name(default)} nodefault={source_name(nodefault)}"
              )


          cases = (
              ([], "default=DEFAULT nodefault=NONE"),
              (
                  ["--default", "cli", "--nodefault", "also"],
                  "default=COMMANDLINE nodefault=COMMANDLINE",
              ),
          )
          failed = False
          for args, expected in cases:
              result = CliRunner().invoke(cli, args)
              if result.exit_code != 0 or result.output.strip() != expected:
                  failed = True

          if failed:
              print("REPOFIX_CLICK_3458_REPRODUCED")
              raise SystemExit(1)

          print("REPOFIX_CLICK_3458_NOT_REPRODUCED")
    regression-parameter-source:
      argv:
        - python
        - -B
        - -c
        - |-
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "src"))

          import click
          import pytest

          click_file = Path(click.__file__).resolve()
          workspace_package = (Path.cwd() / "src/click").resolve()
          print("PYTHON_EXECUTABLE=" + sys.executable)
          print("CLICK_FILE=" + click.__file__)
          print("PYTEST_FILE=" + pytest.__file__)
          print("PYTEST_VERSION=" + pytest.__version__)
          if not click_file.is_relative_to(workspace_package):
              print("REPOFIX_CLICK_3458_PROVENANCE_ERROR")
              raise SystemExit(2)
          raise SystemExit(pytest.main([
              "-p",
              "no:cacheprovider",
              "-c",
              "pyproject.toml",
              "tests/test_context.py::test_parameter_source",
          ]))
  allowed_source_paths:
    - src/click
    - tests
  patchable_source_paths:
    - src/click
  timeout_seconds: 300
