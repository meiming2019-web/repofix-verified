task:
  task_id: empty-header-bug
  repository_url: https://github.com/example/empty-header-bug.git
  pre_fix_commit: 0123456789abcdef0123456789abcdef01234567
  issue_title: Empty headers discard the configured value
  issue_body: >-
    When the incoming header is empty, parse_header returns the module default instead
    of retaining the configured value. Nonempty headers continue to work as expected.
  approved_commands:
    unit_tests:
      argv:
        - pytest
        - -q
        - -p
        - no:cacheprovider
        - tests/test_header_parser.py::test_empty_header_retains_configured_value
    regression_tests:
      argv:
        - pytest
        - -q
        - -p
        - no:cacheprovider
        - tests/test_header_parser.py::test_nonempty_header_is_returned
  allowed_source_paths:
    - src
    - tests
  patchable_source_paths:
    - src
  timeout_seconds: 300
reproduction:
  command_id: unit_tests
  expected_exit_codes:
    - 1
  required_fragments:
    - fragment_id: target-test-name
      stream: combined
      text: test_empty_header_retains_configured_value
    - fragment_id: target-assertion
      stream: combined
      text: "assert 'default' == 'configured'"
    - fragment_id: expected-test-count
      stream: combined
      text: 1 failed
  forbidden_fragments:
    - fragment_id: module-import-error
      stream: combined
      text: ModuleNotFoundError
    - fragment_id: pytest-collection-error
      stream: combined
      text: ERROR collecting
regression:
  command_id: regression_tests
hidden_verification:
  command_id: hidden_tests
  launcher:
    argv:
      - pytest
      - -q
      - -p
      - no:cacheprovider
      - --rootdir
      - .
      - -c
      - pytest.ini
  test_file:
    path: hidden_tests/test_header_parser_hidden.py
    sha256: 9dcd8d63683013ffb949b6e9e5fde427fd78e6aa2c761a727e05662de6d978b6
    size_bytes: 259
gold_patch:
  patch: |-
    --- a/src/header_parser.py
    +++ b/src/header_parser.py
    @@ -6,5 +6,5 @@
     def parse_header(header: str, configured_value: str) -> str:
         """Return the incoming header, falling back to the configured value when empty."""
         if header == "":
    -        return DEFAULT_VALUE
    +        return configured_value
         return header
