task:
  task_id: attrs-670-custom-eq-autodetect
  repository_url: https://github.com/python-attrs/attrs.git
  pre_fix_commit: 1a29941d5cf74ca585780495cb6c17fd013ec861
  issue_title: "@attr.define fails to auto-detect custom __eq__"
  issue_body: >-
    A class decorated with @attr.define may define its own __eq__ implementation. With the
    decorator's default behavior, attrs should auto-detect and preserve that user-defined
    equality implementation. At this revision, generated equality behavior replaces or bypasses
    the custom method. Normal classes that rely on generated equality must continue to behave
    normally.
  approved_commands:
    reproduce-attrs-670:
      argv:
        - python
        - -B
        - -c
        - |-
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "src"))

          import attr

          print("PYTHON_EXECUTABLE=" + sys.executable)
          print("CWD=" + os.getcwd())
          print("ATTR_FILE=" + attr.__file__)
          print("SYS_PATH_0=" + sys.path[0])


          @attr.define
          class Number:
              value: int

              def __eq__(self, other):
                  if not isinstance(other, Number):
                      return NotImplemented
                  return self.value % 10 == other.value % 10


          if Number(1) != Number(11):
              print("REPOFIX_ATTRS_670_REPRODUCED")
              raise SystemExit(1)

          print("REPOFIX_ATTRS_670_NOT_REPRODUCED")
    regression-next-gen-equality:
      argv:
        - python
        - -B
        - -c
        - |-
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "src"))

          import attr
          import pytest

          print("PYTHON_EXECUTABLE=" + sys.executable)
          print("ATTR_FILE=" + attr.__file__)
          print("PYTEST_FILE=" + pytest.__file__)
          print("PYTEST_VERSION=" + pytest.__version__)
          raise SystemExit(pytest.main([
              "-p",
              "no:cacheprovider",
              "-c",
              "tox.ini",
              "tests/test_next_gen.py::TestNextGen::test_auto_attribs_detect",
          ]))
  allowed_source_paths:
    - src/attr
    - tests
  patchable_source_paths:
    - src/attr
  timeout_seconds: 300
reproduction:
  command_id: reproduce-attrs-670
  expected_exit_codes:
    - 1
  required_fragments:
    - fragment_id: attrs-670-reproduced
      stream: stdout
      text: REPOFIX_ATTRS_670_REPRODUCED
  forbidden_fragments: []
regression:
  command_id: regression-next-gen-equality
